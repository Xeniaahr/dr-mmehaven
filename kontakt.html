<link rel="stylesheet" href="style.css">
<!-- Fontawesome ikoner -->
<script src="https://kit.fontawesome.com/829d5199ff.js" crossorigin="anonymous"></script>
<!-- JavaScript fil -->
<script src="script.js" defer></script>
</head>
<body>

<header>
<div class="navbar">
<div class="logo">
<a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
<i class="fa-regular fa-moon" aria-hidden="true"></i>
<span>Drømmehaven</span>
</a>
</div>

<div class="nav-container">
<button id="bars"
aria-expanded="false"
aria-controls="menu"
aria-label="åben navigation"
class="burger-menu"
>
<i class="fa-solid fa-bars" aria-hidden="true"></i>
</button>

<nav id="menu">
<ul class="nav-links">
<li><a href="index.html">Forside</a></li>

<li><a class="active" href="kontakt.html">Kontakt & støtte</a></li>
</ul>
</nav>
</div>
</div>
</header>

<main class="kontakt-indhold">
<div class="kontakt-header">
<h1>Kontakt & støtte</h1>
<p>Du er ikke alene. Her kan du række ud - helt uforpligtende.</p>
</div>

<div class="kontakt-grid">
<div class="kontakt-info-boks">
<div class="info-item">
<i class="fa-solid fa-phone" aria-hidden="true"></i>
<div>
<h3>Ring til os</h3>
<p class="telefon-nr"><a href="tel:+4528688782" style="color: inherit; text-decoration: none;">+45 28688782</a></p>
</div>
</div>
<p>Har du brug for nogen at tale med her og nu? Vores linjer er åbne, og vi sidder klar til at lytte.</p>
</div>

<div class="kontakt-form-boks">
<h2>Skriv til os</h2>

<form id="kontakt-form" action="#" method="POST">
<div class="form-gruppe">
<label for="navn">Navn</label>
<input type="text" id="navn" name="navn" required aria-required="true">
</div>

<div class="form-gruppe">
<label for="email">E-mail</label>
<input type="email" id="email" name="email" required aria-required="true">
</div>

<div class="form-gruppe">
<label for="besked">Besked</label>
<textarea id="besked" name="besked" rows="4" required aria-required="true"></textarea>
</div>

<button type="submit" class="cta-knap">Send besked</button>
</form>

</div>
</div>
</div>
</main>

</body>
</html>
