<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drømmehaven</title>
    <!--fonts og stylesheet-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome ikoner -->
    <script src="https://kit.fontawesome.com/829d5199ff.js" crossorigin="anonymous"></script>
</head>
<body>
  
    <!--header og navigation-->
    <header>
        <nav class="navbar" aria-label="Hovedmenu"> <!-- aria label = kan læses op af skærmlæsere og andre hjælpemidler for blinde eller svagtseende-->
        <div class="logo">
                <i class="fa-regular fa-moon"></i> <!--måne logo-->
                <span>Drømmehaven</span> <!--drømmehaven i venstre hjørne-->
            </div>

            <!-- Burgermenu -->
            <input type="checkbox" id="burger-check" hidden> <!--usynlig checkbox, "type checkbox" gør at den kan være tjekket af og ikke tjekket af-->
            <label for="burger-check" class="burger-menu" aria-label="Åbn menu"> <!--Når en bruger klikker på elementet, ændrer tjekboksen ovenfor status-->
                <i class="fa-solid fa-bars"></i> <!--ikon til menuen fra fontawesome (3 streger)-->
            </label>

            <!-- Menu links -->
            <ul class="nav-links"> <!--giver listen et navn, så man via CSS kan style menuen-->
                <li><a href="index.html">Forside</a></li>
                <li><a href="mental-sundhed.html">Mental sundhed</a></li>
                <li><a href="kontakt.html">Kontakt & støtte</a></li>
                <!-- href - angiver stien til den side, man bliver sendt over på, når man klikker-->
            </ul>
        </nav>
    </header>

     <main>
        <!-- Intro sektion -->
        <section class="tekst-img">
            <div class="tekst-indhold">
                <h1>Et sted hvor du kan drømme dig væk fra hverdagens larm</h1> <!--sidens hovedoverskrift-->
                <p>Drømmehaven er et digitalt fristed for unge. Her finder du råd, inspiration og redskaber til at håndtere stress, tankemylder og hverdagens pres.</p>
                <!--p = almindelig tekstafsnit-->
                <a href="mental-sundhed.html" class="cta-knap">Udforsk gode råd</a>
                <!--link der leder brugeren videre til undersiden mental sundhed-->
            </div>

            <div class="billede"> <!--billede til forside-->
                <img src="stemning.jpg" alt="Person med en kaffekop der sidder ved et vindue og kigger ud">
                <!--alt beskriver billedet for skærmlæsere osv.-->
            </div>
        </section>
    
</body>
</html>
